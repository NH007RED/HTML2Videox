/* ===================== backdrop / captions ===================== */
function backdrop(T){
  c.fillStyle="#050918";c.fillRect(0,0,W,H);
  var g=c.createRadialGradient(CX,520,60,CX,520,1100);g.addColorStop(0,"rgba(60,50,170,.45)");g.addColorStop(.5,"rgba(20,30,90,.35)");g.addColorStop(1,"rgba(0,0,0,0)");c.fillStyle=g;c.fillRect(0,0,W,H);
  var g2=c.createRadialGradient(1500,200,20,1500,200,600);g2.addColorStop(0,"rgba(34,211,238,.16)");g2.addColorStop(1,"rgba(34,211,238,0)");c.fillStyle=g2;c.fillRect(0,0,W,H);

  for(var x=-80+o;x<W;x+=80){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}
  for(var y=-80+o;y<H;y+=80){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}c.restore();
  for(var k=0;k<60;k++){var sp=5+hs(k+3)*14,x=(hs(k)*W+T*sp+W*4)%W,y=(hs(k+40)*H-T*sp*.5+H*4)%H,r=.8+hs(k+80)*2,a=.12+.28*hs(k+120)*(.6+.4*Math.sin(T*.8+k));
    c.fillStyle=hs(k+7)<.5?"rgba(34,211,238,"+a+")":"rgba(160,140,255,"+a+")";c.beginPath();c.arc(x,y,r,0,7);c.fill()}
}
function wrapLines(s,mw,font){c.save();c.font=font;var w=s.split(" "),L=[],l="";w.forEach(function(k){var q=l?l+" "+k:k;if(c.measureText(q).width>mw&&l){L.push(l);l=k}else l=q});L.push(l);c.restore();return L}
function caption(i,q){
  if(!document.getElementById("cap").checked)return;
  var s=SC[i];if(!s.sn){s.sn=(s.vo.replace(/(\d)\.(\d)/g,"$1\u0001$2").replace(/\.(?=aab)/g,"\u0001").match(/[^.!?]+[.!?]+(?:["”])?\s*/g)||[s.vo]).map(function(x){return x.replace(/\u0001/g,".")})}
  var L=s.vo.length,pos=cl(q,0,.999)*L,acc=0,k=0;for(;k<s.sn.length-1;k++){if(pos<acc+s.sn[k].length)break;acc+=s.sn[k].length}

  lines.forEach(function(l,j){tx(l,CX,y0+11+lh/2+j*lh,fs,"#fff","center",600)});c.restore()}

function ico(x,y,r,kind,col){c.save();c.translate(x,y);c.strokeStyle=col;c.fillStyle=col;c.lineWidth=r*.16;c.lineCap="round";c.lineJoin="round";
  if(kind==="lock"){c.beginPath();c.arc(0,-r*.2,r*.32,Math.PI,0);c.stroke();rr(-r*.42,-r*.2,r*.84,r*.62,r*.1);c.fill()}
  else if(kind==="check"){c.beginPath();c.moveTo(-r*.4,0);c.lineTo(-r*.1,r*.3);c.lineTo(r*.45,-r*.32);c.stroke()}
  else if(kind==="down"){c.beginPath();c.moveTo(0,-r*.45);c.lineTo(0,r*.3);c.moveTo(-r*.3,r*.02);c.lineTo(0,r*.32);c.lineTo(r*.3,r*.02);c.moveTo(-r*.4,r*.5);c.lineTo(r*.4,r*.5);c.stroke()}

  else if(kind==="gear"){c.beginPath();c.arc(0,0,r*.28,0,7);c.stroke();for(var k=0;k<8;k++){var a=k*Math.PI/4;c.beginPath();c.moveTo(Math.cos(a)*r*.42,Math.sin(a)*r*.42);c.lineTo(Math.cos(a)*r*.58,Math.sin(a)*r*.58);c.stroke()}}

function frameAt(T){
  var p=PLAN[PLAN.length-1];for(var k=0;k<PLAN.length;k++){if(T<PLAN[k].start+PLAN[k].len){p=PLAN[k];break}}
  var t=cl(T-p.start,0,p.len),q=cl((t-p.vs)/p.vd,0,1.2);
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.setLineDash([]);c.lineDashOffset=0;noglow();c.clearRect(0,0,W,H);
  backdrop(T);
  // smooth zoom-in har scene ke shuru mein
  var z=1+.05*(1-E(seg(t,0,1.4)));c.save();c.translate(CX,540);c.scale(z,z);c.translate(-CX,-540);sceneDraw(p,T,t);c.restore();
  var v=c.createRadialGradient(CX,540,520,CX,540,1250);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.55)");c.fillStyle=v;c.fillRect(0,0,W,H);

/* ===================== Preview ===================== */
var $=function(x){return document.getElementById(x)},st=$("st"),pv=$("pv"),msg=function(m){st.textContent=m};
var raf=0,pvOn=false,lastScene=-1;
function say(i){try{if(!window.speechSynthesis||!$("vo").checked)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(SC[i].vo);u.lang="hi-IN";u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function stopPv(){cancelAnimationFrame(raf);pvOn=false;pv.textContent="▶ Preview chalao";try{speechSynthesis.cancel()}catch(e){}}
pv.onclick=function(){if(pvOn){stopPv();return}
  DUR=null;buildPlan();var t0=performance.now()+150;pvOn=true;lastScene=-1;pv.textContent="⏹ Stop preview";msg("Preview chal raha hai...");
  (function loop(){var T=(performance.now()-t0)/1000;
    if(T>=TOTAL){stopPv();msg("Preview khatam.");frameAt(2.5);return}
    T=Math.max(0,T);var k=0;for(;k<PLAN.length-1;k++){if(T<PLAN[k].start+PLAN[k].len)break}
    if(k!==lastScene&&T>=PLAN[k].start+PLAN[k].vs){lastScene=k;say(k)}
    frameAt(T);raf=requestAnimationFrame(loop)})()};

/* ===== NH API: Android app (HTML2Video) in functions ko bulati hai. Inhe mat badlo ===== */
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};

  lang:"hi-IN",

    PLAN.forEach(function(p){if(DUR[p.i]&&DUR[p.i].a>0)ev.push({key:p.i+"a",at:p.start+p.vs})});
    return JSON.stringify({total:TOTAL,events:ev})},
  run:async function(fps){
    try{buildPlan();var N=Math.ceil(TOTAL*fps);
      for(var n=0;n<N;n++){frameAt(n/fps);
        if(Android.pushFrame(cv.toDataURL("image/jpeg",0.95))===false){Android.fail("Cancel ho gaya");return}
        if(n%20===0){Android.progress(n,N);await sleep(0)}}
      Android.progress(N,N);Android.done()}
    catch(e){Android.fail(String(e&&e.message?e.message:e))}}
};
